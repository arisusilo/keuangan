<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Catat pemasukan dan pengeluaran langsung dari HP, tersimpan ke Google Sheets.">
  <title>Catatan Keuangan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <div id="app" class="app">
    <!-- Layar hubungkan (pertama kali dibuka) -->
    <section id="screen-connect" class="screen screen-connect" hidden>
      <div class="connect-wrap">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d5afe"/><stop offset="1" stop-color="#8e5cf7"/></linearGradient></defs><rect x="4" y="4" width="40" height="40" rx="13" fill="url(#bm)"/><path d="M15 29l6-6 5 4 8-9" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1 class="connect-title">Catatan Keuangan</h1>
        <p class="connect-sub">Hubungkan ke spreadsheet-mu sekali saja. Setelah itu, mencatat cukup beberapa ketukan.</p>
        <form id="connect-form" class="card connect-card" novalidate>
          <label class="field">
            <span class="field-label">Alamat aplikasi web (URL)</span>
            <input id="cf-url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" required>
          </label>
          <label class="field">
            <span class="field-label">Kunci aplikasi</span>
            <input id="cf-key" type="password" autocomplete="off" placeholder="KU-…" required>
          </label>
          <p id="cf-error" class="form-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="cf-submit">Hubungkan</button>
        </form>
        <button type="button" class="btn btn-ghost btn-block" id="cf-demo">Coba dulu dengan data contoh</button>
        <p class="connect-help">URL dan kunci didapat dari langkah setup di panduan.</p>
      </div>
    </section>

    <!-- Aplikasi utama -->
    <div id="main" class="main" hidden>
      <header class="topbar">
        <div class="topbar-text">
          <p class="topbar-hello" id="hello">Halo</p>
          <h1 class="topbar-title" id="page-title">Beranda</h1>
        </div>
        <div class="topbar-actions">
          <span class="sync-pill" id="sync-pill" hidden></span>
          <button class="icon-btn" id="btn-refresh" aria-label="Muat ulang data">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
          </button>
        </div>
      </header>

      <div id="demo-banner" class="demo-banner" hidden>
        Mode contoh: data ini bukan milikmu. <button class="link-btn" id="demo-exit">Hubungkan spreadsheet</button>
      </div>

      <main id="views" class="views">
        <section id="view-home" class="view" data-title="Beranda"></section>
        <section id="view-history" class="view" data-title="Riwayat" hidden></section>
        <section id="view-stats" class="view" data-title="Analisis" hidden></section>
        <section id="view-settings" class="view" data-title="Pengaturan" hidden></section>
      </main>

      <nav class="bottomnav" aria-label="Navigasi utama">
        <button class="nav-btn is-active" data-view="home">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>Beranda</span>
        </button>
        <button class="nav-btn" data-view="history">
          <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
          <span>Riwayat</span>
        </button>
        <button class="nav-fab" id="fab" aria-label="Tambah transaksi">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="nav-btn" data-view="stats">
          <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
          <span>Analisis</span>
        </button>
        <button class="nav-btn" data-view="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Atur</span>
        </button>
      </nav>
    </div>

    <!-- Lembar bawah (form, detail, dialog) -->
    <div id="scrim" class="scrim" hidden></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="sheet-body" class="sheet-body"></div>
    </section>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="tooltip" class="chart-tip" role="status" hidden></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
